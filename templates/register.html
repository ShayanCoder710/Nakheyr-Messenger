{% extends "base.html" %}
{% block title %}ثبت‌نام در نخیر{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <img src="{{ url_for('static', filename='images/icon.png') }}" class="auth-logo" alt="نخیر">
    <h1>ساخت اکانت</h1>
    <p class="auth-sub">یکدقیقه‌ای زمان می‌بره، بعدش وارد نخیر شدی</p>
    <form method="post">
      <label class="label" for="username">نام کاربری (انگلیسی)</label>
      <input class="input" id="username" name="username" required placeholder="sara_k" pattern="[a-zA-Z0-9_]{3,30}" autocomplete="off">
      <label class="label" for="display_name">نام کاربر</label>
      <input class="input" id="display_name" name="display_name" required placeholder="شایان سیدی" minlength="2">
      <label class="label" for="password">پسورد</label>
      <input class="input" id="password" name="password" type="password" required minlength="6" placeholder="حداقل ۶ کاراکتر">
      <button class="btn primary" type="submit" style="width:100%; justify-content:center; margin-top:20px">ساخت اکانت</button>
    </form>
    <p class="auth-switch">پیش‌تر ثبت‌نام کردی؟ <a href="{{ url_for('login') }}">ورود</a></p>
  </div>
</div>
{% if get_flashed_messages(with_categories=true) %}
<script type="module">
const flashes = [{% for category, message in get_flashed_messages(with_categories=true) %}{{ message|tojson }}{% if not loop.last %},{% endif %}{% endfor %}];
const { Eggy } = await import('{{ url_for('static', filename='js/eggy.js') }}?v=4');
for (const m of flashes) {
  await Eggy({ type: 'error', title: '', message: m });
}
</script>
{% endif %}
<script>
(function () {
  const inp = document.getElementById('username');
  inp.addEventListener('input', () => {
    const pos = inp.selectionStart;
    const clean = inp.value.replace(/[^a-zA-Z0-9_]/g, '');
    if (clean !== inp.value) {
      inp.value = clean;
      inp.setSelectionRange(Math.min(pos, clean.length), Math.min(pos, clean.length));
    }
  });
  inp.addEventListener('keydown', e => {
    if (e.key.length === 1 && !/^[a-zA-Z0-9_]$/.test(e.key)) e.preventDefault();
  });
})();
</script>
{% endblock %}
