<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="{{ (me.theme if me else 'dark') or 'dark' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>{% block title %}نخیر{% endblock %}</title>
<link rel="icon" type="image/png" href="/static/images/icon.png">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% block extra_head %}{% endblock %}
</head>
<body>
{% include '_bi_sprite.html' %}
<div class="toast-wrap" id="toastWrap"></div>
{% block content %}{% endblock %}
<script src="{{ url_for('static', filename='vendor/socket.io.min.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/marked.min.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/purify.min.js') }}"></script>
<script>window.CSRF_TOKEN = "{{ csrf_token }}";</script>
<script>
// CSRF: automatically attach the session token to every same-site POST.
(function () {
  if (!window.CSRF_TOKEN) return;
  const orig = window.fetch;
  window.fetch = function (input, init) {
    init = init || {};
    const method = (init.method || (typeof input === 'object' && input.method) || 'GET').toUpperCase();
    if (method === 'POST' && !(init.headers instanceof Headers && init.headers.has('X-CSRF-Token'))) {
      const h = new Headers(init.headers);
      if (!h.has('X-CSRF-Token')) h.set('X-CSRF-Token', window.CSRF_TOKEN);
      init.headers = h;
    }
    return orig.apply(window, arguments);
  };
  const X = window.XMLHttpRequest;
  if (X && !X.__csrfPatched) {
    const oOpen = X.prototype.open;
    const oSend = X.prototype.send;
    X.prototype.open = function (method) {
      this.__csrfMethod = String(method || '').toUpperCase();
      return oOpen.apply(this, arguments);
    };
    X.prototype.send = function () {
      if (this.__csrfMethod === 'POST') {
        try {
          this.setRequestHeader('X-CSRF-Token', window.CSRF_TOKEN);
        } catch (_) {}
      }
      return oSend.apply(this, arguments);
    };
    X.__csrfPatched = true;
  }
})();
</script>
<script>
window.md = function(src) {
  if (!src) return '';
  if (typeof marked !== 'undefined' && typeof DOMPurify !== 'undefined') {
    try {
      // Telegram-style: *text* = bold, _text_ = italic, `code` / ```block``` = monospace.
      // marked renders *text* as <em> by default, so convert single asterisks
      // to double ones first (bold), leaving underscore italics untouched.
      const pre = String(src).replace(
        /(^|[^*])\*(?!\*)([^*\n]+)\*(?!\*)/g,
        '$1**$2**'
      );
      const raw = marked.parse(pre, { breaks: true, gfm: true });
      // With breaks:true a single newline becomes <br> (Telegram-like), but
      // marked can also add one right before a closing block tag. Remove only
      // those edge cases so normal line breaks inside messages survive.
      const cleaned = raw
        .replace(/<br\s*\/?>\s*(?=<\/(?:p|li|ul|ol|pre|blockquote|h[1-6])>)/gi, '')
        .replace(/(<(?:p|li|ul|ol|pre|blockquote|h[1-6])(?:\s[^>]*)?>)\s*<br\s*\/?>/gi, '$1');
      return DOMPurify.sanitize(cleaned, { USE_PROFILES: { html: true }, FORBID_TAGS: ['style', 'form'] });
    } catch (e) {
      return window.esc(src).replace(/\n/g, '<br>');
    }
  }
  return window.esc(src).replace(/\n/g, '<br>');
};
</script>
<script>
window.toast = function(msg, kind) {
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || 'success');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 3400);
};
window.fmtTime = function(iso) {
  if (!iso) return '';
  const d = new Date(iso.endsWith('Z') || iso.includes('+') ? iso : iso + 'Z');
  return d.toLocaleTimeString('fa-IR', {hour: '2-digit', minute: '2-digit'});
};
window.fmtDay = function(iso) {
  if (!iso) return '';
  const d = new Date(iso.endsWith('Z') || iso.includes('+') ? iso : iso + 'Z');
  const now = new Date();
  const yest = new Date(now); yest.setDate(now.getDate() - 1);
  if (d.toDateString() === now.toDateString()) return 'امروز';
  if (d.toDateString() === yest.toDateString()) return 'دیروز';
  return d.toLocaleDateString('fa-IR');
};
window.esc = function(s) {
  const div = document.createElement('div');
  div.textContent = s == null ? '' : String(s);
  return div.innerHTML;
};
window.bi = function(name, cls) {
  return '<svg class="bi-ic' + (cls ? ' ' + cls : '') + '" aria-hidden="true" focusable="false"><use href="#' + name + '"></use></svg>';
};
window.avatarHtml = function(name, avatar, online, size) {
  const cls = ('avatar' + (size ? ' ' + size : '')).trim();
  const initial = (name || '?').trim().charAt(0);
  const dot = avatar ? '' : (online === undefined ? '' : '<i class="dot ' + (online ? 'on' : 'off') + '"></i>');
  return '<div class="' + cls + '">' + (avatar ? '<img src="' + avatar + '" alt="">' : initial) + dot + '</div>';
};
window.avatarInner = function(name, avatar, online) {
  const initial = esc((name || '?').trim().charAt(0));
  const dot = avatar ? '' : (online === undefined ? '' : '<i class="dot ' + (online ? 'on' : 'off') + '"></i>');
  return (avatar ? '<img src="' + avatar + '" alt="">' : initial) + dot;
};
window.copyText = function(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text);
  }
  return new Promise((resolve, reject) => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    ok ? resolve() : reject(new Error('copy failed'));
  });
};
</script>
<script>
(function () {
  function applyAppHeight() {
    var vv = window.visualViewport;
    var h = vv ? vv.height : window.innerHeight;
    document.documentElement.style.setProperty('--app-h', Math.round(h) + 'px');
  }
  applyAppHeight();
  window.addEventListener('resize', applyAppHeight);
  window.addEventListener('orientationchange', function () { setTimeout(applyAppHeight, 250); });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', applyAppHeight);
    window.visualViewport.addEventListener('scroll', applyAppHeight);
  }
})();
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
