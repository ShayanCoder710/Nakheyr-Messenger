<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>{% block title %}نخیر{% endblock %}</title>
<link rel="icon" type="image/png" href="/static/images/icon.png">
<link rel="stylesheet" href="{{ url_for('static', filename='icons/bootstrap-icons.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% block extra_head %}{% endblock %}
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true" focusable="false">
  <symbol id="bi-Sent" viewBox="0 0 16 16"><path fill="var(--bi-color, currentColor)" d="M10.97 4.97a.75.75 0 0 1 1.07 1.05l-3.99 4.99a.75.75 0 0 1-1.08.02L4.324 8.384a.75.75 0 1 1 1.06-1.06l2.094 2.093 3.473-4.425z"/></symbol>
  <symbol id="bi-Seen" viewBox="0 0 16 16"><path fill="var(--bi-color, currentColor)" d="M8.97 4.97a.75.75 0 0 1 1.07 1.05l-3.99 4.99a.75.75 0 0 1-1.08.02L2.324 8.384a.75.75 0 1 1 1.06-1.06l2.094 2.093L8.95 4.992zm-.92 5.14.92.92a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 1 0-1.091-1.028L9.477 9.417l-.485-.486z"/></symbol>
</svg>
{% include '_bi_sprite.html' %}
<div class="toast-wrap" id="toastWrap"></div>
{% block content %}{% endblock %}
<script src="{{ url_for('static', filename='vendor/socket.io.min.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/marked.min.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/purify.min.js') }}"></script>
<script>
window.md = function(src) {
  if (!src) return '';
  if (typeof marked !== 'undefined' && typeof DOMPurify !== 'undefined') {
    try {
      const raw = marked.parse(src, { breaks: true, gfm: true });
      return DOMPurify.sanitize(raw, { USE_PROFILES: { html: true }, FORBID_TAGS: ['style', 'form'] });
    } catch (e) {
      return window.esc(src).replace(/\n/g, '<br>');
    }
  }
  return window.esc(src).replace(/\n/g, '<br>');
};
</script>
<script>
window.toast = function(msg, kind) {
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || 'success');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 3400);
};
window.fmtTime = function(iso) {
  if (!iso) return '';
  const d = new Date(iso.endsWith('Z') || iso.includes('+') ? iso : iso + 'Z');
  return d.toLocaleTimeString('fa-IR', {hour: '2-digit', minute: '2-digit'});
};
window.fmtDay = function(iso) {
  if (!iso) return '';
  const d = new Date(iso.endsWith('Z') || iso.includes('+') ? iso : iso + 'Z');
  const now = new Date();
  const yest = new Date(now); yest.setDate(now.getDate() - 1);
  if (d.toDateString() === now.toDateString()) return 'امروز';
  if (d.toDateString() === yest.toDateString()) return 'دیروز';
  return d.toLocaleDateString('fa-IR');
};
window.esc = function(s) {
  const div = document.createElement('div');
  div.textContent = s == null ? '' : String(s);
  return div.innerHTML;
};
window.bi = function(name, cls) {
  return '<svg class="bi-ic' + (cls ? ' ' + cls : '') + '" aria-hidden="true" focusable="false"><use href="#' + name + '"></use></svg>';
};
window.avatarHtml = function(name, avatar, online, size) {
  const cls = ('avatar' + (size ? ' ' + size : '')).trim();
  const initial = (name || '?').trim().charAt(0);
  const dot = avatar ? '' : (online === undefined ? '' : '<i class="dot ' + (online ? 'on' : 'off') + '"></i>');
  return '<div class="' + cls + '">' + (avatar ? '<img src="' + avatar + '" alt="">' : initial) + dot + '</div>';
};
window.avatarInner = function(name, avatar, online) {
  const initial = (name || '?').trim().charAt(0);
  const dot = avatar ? '' : (online === undefined ? '' : '<i class="dot ' + (online ? 'on' : 'off') + '"></i>');
  return (avatar ? '<img src="' + avatar + '" alt="">' : initial) + dot;
};
window.copyText = function(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text);
  }
  return new Promise((resolve, reject) => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    ok ? resolve() : reject(new Error('copy failed'));
  });
};
</script>
<script>
(function () {
  function applyAppHeight() {
    var vv = window.visualViewport;
    var h = vv ? vv.height : window.innerHeight;
    document.documentElement.style.setProperty('--app-h', Math.round(h) + 'px');
  }
  applyAppHeight();
  window.addEventListener('resize', applyAppHeight);
  window.addEventListener('orientationchange', function () { setTimeout(applyAppHeight, 250); });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', applyAppHeight);
    window.visualViewport.addEventListener('scroll', applyAppHeight);
  }
})();
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
