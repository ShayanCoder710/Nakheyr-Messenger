{% extends "base.html" %}
{% block title %}ورود به نخیر{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <img src="{{ url_for('static', filename='images/icon.png') }}" class="auth-logo" alt="نخیر">
    <h1>نخیر</h1>
    <p class="auth-sub">پیامرسان مدرن، سریع و امن</p>
    <form method="post">
      <label class="label" for="username">نام کاربری</label>
      <input class="input" id="username" name="username" required autofocus placeholder="username">
      <label class="label" for="password">پسورد</label>
      <input class="input" id="password" name="password" type="password" required placeholder="••••••••">
      <button class="btn primary" type="submit" style="width:100%; justify-content:center; margin-top:20px">ورود</button>
    </form>
    <p class="auth-switch">حساب نداری؟ <a href="{{ url_for('register') }}">ثبت‌نام</a></p>
  </div>
</div>
{% for msg, kind in get_flashed_messages(with_categories=true) %}
<script>window.addEventListener('load', () => toast('{{ msg }}', '{{ kind }}'));</script>
{% endfor %}
{% endblock %}
